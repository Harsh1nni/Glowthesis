<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Glowthesis | Join Us</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <a href="{{ url_for('home') }}" class="brand-name" style="text-decoration:none;">Glowthesis</a>
        <div class="card auth-card">
            <h2>Create Account</h2>
            <form action="/signup" method="POST">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Log In</a></p>
            <p class="auth-footer"><a href="{{ url_for('analyse') }}" style="opacity: 0.6; text-decoration: underline;">Continue as Guest</a></p>
        </div>
    </div>

</body>
</html>
